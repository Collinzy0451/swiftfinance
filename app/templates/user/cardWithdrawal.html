{% extends 'user/user_layout.html' %}

{% block content %}
<main id="main" class="main">


    <div class="pagetitle">
        <h1>Withdraw Funds</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item">Deposit</li>
                <li class="breadcrumb-item active">Card Withdrawal</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Withdraw with Card</h5>

                        <!-- Multi Columns Form -->
                        <form class="row g-3">
                            <div class="col-12">
                                <label for="inputAddress2" class="form-label">Amount ($)</label>
                                <input type="number" class="form-control" id="inputAddress2">
                            </div>
                            <div class="col-md-6 ">
                                <label for="inputName5" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="inputName5">
                            </div>
                            <div class="col-md-6 ">
                                <label for="inputName5" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="inputName5">
                            </div>
                            <div class="col-md-6">
                                <label for="inputEmail5" class="form-label">Email</label>
                                <input type="email" class="form-control" id="inputEmail5">
                            </div>
                            <div class="col-md-6">
                                <label for="inputEmail5" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="inputEmail5">
                            </div>

                            <div class="col-12">
                                <label for="inputAddress5" class="form-label">Address</label>
                                <input type="text" class="form-control" id="inputAddres5s">
                            </div>
                            <div class="col-12">
                                <label for="inputAddress2" class="form-label">Address 2</label>
                                <input type="text" class="form-control" id="inputAddress2">
                            </div>
                            <div class="col-md-6">
                                <label for="inputCity" class="form-label">City</label>
                                <input type="text" class="form-control" id="inputCity">
                            </div>
                            <div class="col-md-4">
                                <label for="inputState" class="form-label">State</label>
                                <select id="inputState" class="form-select">
                                    <option selected>Choose...</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label for="inputZip" class="form-label">Zip</label>
                                <input type="text" class="form-control" id="inputZip">
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">Make Payment</button>
                            </div>
                        </form><!-- End Multi Columns Form -->

                    </div>
                </div>

            </div>
        </div>
    </section>
</main>

{% endblock content %}
