{% extends 'user/user_layout.html' %}

{% block content %}

<main id="main" class="main">
    <div class="pagetitle">
        <h1>Deposit Funds</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item">Deposit</li>
                <li class="breadcrumb-item active">Card Deposit</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->


    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">

                        <div style="text-align: center; padding-top: 2.5rem; padding-bottom: 2.5rem;">
                            <h3><strong>Stock Investment</strong></h3>
                            <img style="margin-bottom: 8px; width: 5rem; height: 5rem;"
                                src="../../static/images/user/stock.png">
                            <div>
                                <small><strong>Total Holdings:
                                    </strong><span>$2,000</span></small><br>
                                <small><strong>Past Performance: </strong><span>+20% last
                                        month</span></small><br>
                                <small><strong>Current Value: </strong><span>$2,400</span></small>
                            </div>

                        </div>
                        <div class="">
                            <form>
                                <div class="col-lg-12">
                                    <label for="inputAddress2" class="form-label"><strong>Amount
                                            ($)</strong></label>
                                    <input type="number" class="form-control" placeholder="Enter Amount">
                                </div>
                                <div class="col-lg-12 mt-4">
                                    <label for="inputCity" class="form-label"><strong>Duration
                                        </strong><span><strong>(</strong><small>weekly</small><strong>)</strong></span></label>
                                    <input type="number" class="form-control" id="inputCity"
                                        placeholder="Enter Duration in weeks">
                                </div>

                                <div class="text-center mt-4">
                                    <button type="submit" class="btn btn-primary">Make Payment</button>
                                </div>
                            </form><!-- End Multi Columns Form -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

{% endblock content %}
