{% extends 'user/user_layout.html' %}

{% block content %}
<main id="main" class="main">
    {% include 'flashMsg.html' %}
    <div class="pagetitle">
        <h1>Deposit Funds</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{url_for ('home') }}">Home</a></li>
                <li class="breadcrumb-item">Components</li>
                <li class="breadcrumb-item active">Modal</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body profile-card pt-4 d-flex flex-column align-items-center">
                        <h6 class="mt-2"><strong>Send only Bitcoin (BTC) to this address.</strong></h6>
                        <img style="width: 4rem; height: 4rem; margin-top: 0.5rem;"
                            src="{{url_for('static', filename='/images/user/btc.png')}}" alt="btc">
                        <img style="width: 12rem; height: 12rem; margin-top: 1rem; margin-bottom: 1.5rem;"
                            src="{{url_for('static', filename='/images/tccode.jpg')}}" alt="qr-code">

                        <style>
                            .btn {
                                border-radius: 0;
                                background-color: rgb(243, 239, 234);
                            }

                            .copied {
                                display: none;
                            }

                            .copied2 {
                                display: contents;
                            }

                            #link {
                                justify-content: center;
                            }

                            @media (max-width:500px) {
                                .link {
                                    font-size: x-small;
                                }

                                .btn {
                                    border-radius: 0;
                                    background-color: rgb(243, 239, 234);
                                }

                                .copied {
                                    display: none;
                                }

                                .copied2 {
                                    display: contents;
                                }

                            }
                        </style>

                        <div id="link" class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon3"><small class="link"><strong
                                        id="address">3EJ4DFN4B7Vxid3suYkUdjDYUrsECN7obP</strong></small></span>
                            <section><button id="btn" class="btn btn-outline-primary">copy</button></section>
                        </div>
                        <section id="copied" class="copied">copied !</section>
                        <script>
                            const address = document.getElementById('address');
                            const btn = document.getElementById('btn');
                            const copied = document.getElementById('copied');

                            btn.addEventListener('click', () => {
                                if (address) {
                                    // Create a temporary textarea element
                                    const tempInput = document.createElement('textarea');
                                    tempInput.value = address.innerText; // Get text from the address element
                                    document.body.appendChild(tempInput);

                                    // Select and copy the text
                                    tempInput.select();
                                    document.execCommand("copy");

                                    // Remove the temporary textarea
                                    document.body.removeChild(tempInput);

                                    copied.classList.add('copied2');
                                    // Remove the class after 3 seconds
                                    setTimeout(() => {
                                        copied.classList.remove('copied2');
                                    }, 2000);
                                } else {
                                    alert("Address element not found!");
                                }
                            });
                        </script>



                    </div>
                </div>

            </div>

        </div>
    </section>
</main><!-- End #main -->

{% endblock content %}
